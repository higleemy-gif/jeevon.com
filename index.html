<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jeevon — Clean Skincare &amp; Everyday Healthcare</title>
    <meta
      name="description"
      content="Jeevon makes clean, dermatologist-safe skincare and everyday healthcare essentials. Genuine products, delivered to your doorstep."
    />
    <!-- Deep green sampled from the logo artwork -->
    <meta name="theme-color" content="#1a4133" />

    <!-- Link preview card (WhatsApp, iMessage, Slack, Twitter, Facebook).
         Scrapers need an ABSOLUTE URL for og:image, so swap both commented
         lines in for your real domain once it is live. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jeevon" />
    <meta property="og:title" content="Jeevon — Clean Skincare &amp; Everyday Healthcare" />
    <meta
      property="og:description"
      content="Dermatologist-safe formulas and everyday health essentials. Genuine products, delivered to your doorstep."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jeevon — Care, Nurture, Empower" />
    <!-- <meta property="og:url" content="https://yourdomain.com/" /> -->
    <!-- <meta property="og:image" content="https://yourdomain.com/og.png" /> -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: elegant serif for headings, clean sans for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon: the logo's icon mark -->
    <link rel="icon" type="image/png" href="/favicon.png" sizes="256x256" />
    <link rel="apple-touch-icon" href="/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
