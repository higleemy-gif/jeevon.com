<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jeevon — Clean Skincare &amp; Everyday Healthcare</title>
    <meta
      name="description"
      content="Jeevon makes clean, dermatologist-safe skincare and everyday healthcare essentials. Genuine products, delivered to your doorstep."
    />
    <meta name="theme-color" content="#6e8a6c" />

    <!-- Link preview card (WhatsApp, iMessage, Slack, Twitter, Facebook).
         Set og:url to your real domain after the first deploy. To get an image
         in the card, add a 1200x630 PNG at public/og.png and uncomment the
         og:image tags — social scrapers do not render SVG previews. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jeevon" />
    <meta property="og:title" content="Jeevon — Clean Skincare &amp; Everyday Healthcare" />
    <meta
      property="og:description"
      content="Dermatologist-safe formulas and everyday health essentials. Genuine products, delivered to your doorstep."
    />
    <!-- <meta property="og:url" content="https://yourdomain.com/" /> -->
    <!-- <meta property="og:image" content="https://yourdomain.com/og.png" /> -->
    <!-- <meta property="og:image:width" content="1200" /> -->
    <!-- <meta property="og:image:height" content="630" /> -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: elegant serif for headings, clean sans for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/svg+xml" href="/leaf.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
